name: convert

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -encoders | grep libx265
      - name: testes
        run: python3 -m unittest discover -s tests -v
      - name: demo + convert
        run: |
          python3 -m video_to_live --make-demo demo/orbits.mp4
          python3 -m video_to_live demo/orbits.mp4 -o /tmp/live
          python3 -m video_to_live --check /tmp/live/orbits.MOV /tmp/live/orbits.HEIC /tmp/live/orbits.pvt
          test -d /tmp/live/orbits.pvt
          python3 -m video_to_live demo/orbits.mp4 --start 0 --end 1 -o /tmp/live-range
          python3 -m video_to_live --check /tmp/live-range/orbits.MOV /tmp/live-range/orbits.HEIC /tmp/live-range/orbits.pvt
          python3 -m video_to_live serve --help
